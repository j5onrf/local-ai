<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" fill="none">
  <!-- Card Background -->
  <rect width="800" height="480" rx="16" fill="#0d1117" stroke="#21262d" stroke-width="2" />

  <!-- Ambient Glow -->
  <circle cx="400" cy="200" r="140" fill="#38bdf8" opacity="0.06" />

  <!-- Center Bot Graphic -->
  <g transform="translate(350, 130)">
    <rect x="0" y="0" width="100" height="90" rx="20" fill="#161b22" stroke="#38bdf8" stroke-width="4" />
    <circle cx="32" cy="42" r="8" fill="#38bdf8" />
    <circle cx="68" cy="42" r="8" fill="#38bdf8" />
    <path d="M 36 64 Q 50 74 64 64" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" />
    <!-- Antennas -->
    <path d="M 50 0 L 50 -16" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <circle cx="50" cy="-20" r="6" fill="#00F2FE" />
  </g>

  <!-- Typography -->
  <text x="400" y="280" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="1">PyBot</text>
  <text x="400" y="315" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16">Web Assistant & Embedded Agent Plugin</text>

  <!-- Status Pill -->
  <g transform="translate(330, 350)">
    <rect width="140" height="30" rx="15" fill="#1f2937" stroke="#374151" />
    <circle cx="20" cy="15" r="4" fill="#fbbf24" />
    <text x="75" y="20" text-anchor="middle" fill="#d1d5db" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Coming Soon</text>
  </g>
</svg>
