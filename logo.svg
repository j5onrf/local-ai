<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Primary Gradient: Electric Cyan to Deep Indigo -->
    <linearGradient id="python-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Secondary Gradient: Bright Teal Cursor Accent -->
    <linearGradient id="prompt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ERD0" />
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Subtle Drop Shadow for Contrast on Light/Dark Themes -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Interlocking Python Snake Loop A -->
    <path d="M 210 120 
             C 140 120, 140 220, 210 220 
             L 300 220 
             C 370 220, 370 320, 300 320 
             L 240 320" 
          fill="none" 
          stroke="url(#python-grad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Interlocking Python Snake Loop B -->
    <path d="M 302 392 
             C 372 392, 372 292, 302 292 
             L 212 292 
             C 142 292, 142 192, 212 192 
             L 272 192" 
          fill="none" 
          stroke="url(#python-grad)" 
          stroke-width="36" 
          stroke-opacity="0.75" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Terminal Prompt Elements (>_) -->
    <g fill="none" stroke="url(#prompt-grad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
      <!-- Chevron Cursor '>' -->
      <polyline points="100,230 136,256 100,282" />
      <!-- Underscore Cursor '_' -->
      <line x1="100" y1="324" x2="136" y2="324" />
    </g>

    <!-- Focal Terminal Node Dot -->
    <circle cx="210" cy="120" r="14" fill="#00F2FE" />
    <circle cx="302" cy="392" r="14" fill="#818CF8" />
  </g>
</svg>
